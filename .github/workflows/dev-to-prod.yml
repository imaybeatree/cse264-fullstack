name: dev -> prod

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base prod \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if missing
        if: steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base prod \
            --head dev \
            --title "Push dev to prod" \
            --body "This PR was automatically created from the latest changes merged into dev."

      - name: Update existing PR title/body
        if: steps.check_pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ steps.check_pr.outputs.number }}" \
            --title "Push dev to prod" \
            --body "This PR tracks the latest changes in dev and is automatically kept up to date."